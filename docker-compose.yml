services:

  # ── PHP-FPM (Symfony backend) ──────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-changeme_secret_32chars_minimum}
      DATABASE_URL: postgresql://taskflow:taskflow@db:5432/taskflow?serverVersion=17&charset=utf8
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-%kernel.project_dir%/config/jwt/private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-%kernel.project_dir%/config/jwt/public.pem}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-taskflow}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow

  # ── Nginx (reverse proxy for Symfony) ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - taskflow

  # ── PostgreSQL 17 ──────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taskflow

  # ── Next.js 16 (frontend) ─────────────────────────────────────────────────
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # Internal URL for SSR server-side fetches inside Docker network
      API_INTERNAL_URL: http://nginx
    command: sh -c "[ -f package.json ] && npm run dev || echo 'Frontend not bootstrapped yet — run: docker compose exec frontend sh'"
    depends_on:
      - nginx
    networks:
      - taskflow

networks:
  taskflow:
    driver: bridge

volumes:
  db_data:
